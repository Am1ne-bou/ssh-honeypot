name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      - name: build
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null .

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
